<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังเปิดวิดีโอ...</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
    .btn { background: #ff0000; color: #fff; padding: 16px 32px; border-radius: 12px; text-decoration: none; font-size: 20px; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="msg">กำลังเปิดคลิปใน YouTube...</div>
  <a id="openBtn" class="btn" href="#">แตะที่นี่เพื่อเปิดดู</a>
  <script>
    const params = new URLSearchParams(window.location.search);
    const v = params.get('v');
    if (v) {
      const ytAppUrl = 'youtube://watch?v=' + v;
      const ytWebUrl = 'https://m.youtube.com/watch?v=' + v;
      document.getElementById('openBtn').href = ytWebUrl;
      // สั่งเด้งเข้าแอป YouTube ทันที
      window.location.href = ytAppUrl;
      // หากเครื่องไม่มีแอป YouTube ให้เปิดผ่านหน้าเว็บ YouTube แทนภายใน 1.5 วินาที
      setTimeout(() => { window.location.href = ytWebUrl; }, 1500);
    }
  </script>
</body>
</html>
